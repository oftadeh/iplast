# Builds run on the host network so an optional BUILD_PROXY on 127.0.0.1 (servers behind a VPN) is reachable.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes: [redisdata:/data]

  migrate:
    build: { network: host, context: ., dockerfile: infra/Dockerfile.node, args: { APP: api, HTTPS_PROXY: "${BUILD_PROXY:-}", HTTP_PROXY: "${BUILD_PROXY:-}", https_proxy: "${BUILD_PROXY:-}", http_proxy: "${BUILD_PROXY:-}" } }
    env_file: .env
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { network: host, context: ., dockerfile: infra/Dockerfile.node, args: { APP: api, HTTPS_PROXY: "${BUILD_PROXY:-}", HTTP_PROXY: "${BUILD_PROXY:-}", https_proxy: "${BUILD_PROXY:-}", http_proxy: "${BUILD_PROXY:-}" } }
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/data/uploads   # product photos added in the admin panel
      - ${PROXY_INBOX:-./.proxy-inbox}:/data/proxy   # outbound proxy status / new subscription (servers behind a proxy only)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  bot:
    build: { network: host, context: ., dockerfile: infra/Dockerfile.node, args: { APP: bot, HTTPS_PROXY: "${BUILD_PROXY:-}", HTTP_PROXY: "${BUILD_PROXY:-}", https_proxy: "${BUILD_PROXY:-}", http_proxy: "${BUILD_PROXY:-}" } }
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }

  # mini app (/) + admin panel (/admin/) + API behind HTTPS on SITE_HOST
  web:
    build: { network: host, context: ., dockerfile: infra/Dockerfile.web, args: { HTTPS_PROXY: "${BUILD_PROXY:-}", HTTP_PROXY: "${BUILD_PROXY:-}", https_proxy: "${BUILD_PROXY:-}", http_proxy: "${BUILD_PROXY:-}" } }
    restart: unless-stopped
    # SITE_ADDR=":80" when another web server on this machine already owns ports 80/443 and forwards here
    environment: { SITE_HOST: "${SITE_HOST}", SITE_ADDR: "${SITE_ADDR:-${SITE_HOST}}" }
    ports: ["${HTTP_BIND:-80}:80", "${HTTPS_BIND:-443}:443"]
    volumes: [caddydata:/data]
    depends_on: [api]

  # outbound V2Ray proxy for servers that reach Telegram/OpenAI only through a VPN (see infra/proxy).
  # Enabled with COMPOSE_PROFILES=proxy; api/bot then use HTTPS_PROXY=http://proxy:10809.
  proxy:
    image: node:22-bookworm-slim
    profiles: [proxy]
    restart: unless-stopped
    volumes: ["/opt/iplast-proxy:/opt/iplast-proxy:ro"]
    command: ["/opt/iplast-proxy/xray", "run", "-config", "/opt/iplast-proxy/config-docker.json"]

volumes:
  uploads:
  pgdata:
  redisdata:
  caddydata:
